# This is the public release repository. Tags are cut here, after the full-history
# development checkout has been synchronized; see docs/release.md.
# npm Trusted Publisher OIDC is bound to this repository and this workflow for
# @gotsaeng/core, @gotsaeng/cli, and @gotsaeng/mcp — all three are registered and publish
# through this workflow, confirmed by the Release 0.12.0 tag.
# @gotsaeng/mcp was bootstrap-published (0.0.1, manual auth) so its Trusted Publisher
# could be configured — see the historical "bootstrap publish" section in docs/release.md.

name: Release

on:
  push:
    tags:
      # Bare version tags only — NO "v" prefix (e.g. "0.10.1", not "v0.10.1").
      # This matches Obsidian's tag-equals-manifest-version rule.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint

  publish:
    name: Publish to npm (OIDC)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing + provenance

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Upgrade npm before publishing. Node 20's bundled npm is 10.x, which does NOT
      # support OIDC trusted publishing at all (that shipped in npm 11.5.1) — pinning to
      # npm@10 (tried on 2026-08-07) silently fell back to an unauthenticated publish
      # and failed with a 404, since no NODE_AUTH_TOKEN is set. npm 11.x requires Node
      # ^20.17.0 || >=22.9.0, which this job's Node 20 satisfies, and supports OIDC.
      # `npm@latest` (currently 12.x) requires Node >=22.22/24.15/26 and broke this step
      # outright before that. Pin to the 11.x line: new enough for OIDC trusted
      # publishing, old enough to run on this job's Node 20.
      - name: Upgrade npm
        run: npm install -g npm@11

      # npm's default publish dist-tag is `latest`. Without this, a prerelease tag like
      # 0.13.0-beta.1 would publish under `latest` and become what unpinned installs
      # (npx @gotsaeng/mcp, npm install @gotsaeng/cli) resolve — silently replacing the
      # last stable version. Mirrors the prerelease detection the github-release job below
      # already uses for GITHUB_REF_NAME.
      - name: Determine npm dist-tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # Publish @gotsaeng/core FIRST — @gotsaeng/cli depends on it.
      # Publishing cli before core would leave a window where cli resolves a stale core.
      # No NODE_AUTH_TOKEN: npm obtains a short-lived token from the GitHub OIDC provider
      # automatically when id-token: write is set and a Trusted Publisher is configured.
      - name: Publish @gotsaeng/core
        run: pnpm --filter @gotsaeng/core publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

      # Publish @gotsaeng/cli SECOND — after core is live on the registry.
      - name: Publish @gotsaeng/cli
        run: pnpm --filter @gotsaeng/cli publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

      # Publish @gotsaeng/mcp THIRD — it also depends on @gotsaeng/core.
      # @gotsaeng/mcp@0.12.0 published successfully through this OIDC step as part of
      # Release 0.12.0. The one-time manual bootstrap publish and Trusted Publisher
      # registration this step originally depended on are both complete — see the
      # historical "bootstrap publish" section in docs/release.md.
      - name: Publish @gotsaeng/mcp
        run: pnpm --filter @gotsaeng/mcp publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

  github-release:
    name: GitHub Release
    needs: publish # only cut a GitHub release once npm publish succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the Obsidian plugin assets

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the Obsidian plugin so dist/{main.js,manifest.json,styles.css} exist.
      # Obsidian clients download these three files for community-plugin installs.
      - name: Build plugin assets
        run: pnpm build

      # Use this version's CHANGELOG.md section as the release body.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v header="## ${version}" '
            $0 == header { capture = 1; next }
            /^## / { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${version}" > release-notes.md
          fi

      # Create-or-update so a re-run after a flake is safe (npm has already
      # published by this point and cannot be re-published).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;  # tags like 0.10.6-beta.1 are pre-releases
          esac
          assets=(
            apps/obsidian-plugin/dist/main.js
            apps/obsidian-plugin/dist/manifest.json
            apps/obsidian-plugin/dist/styles.css
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating notes and assets."
            gh release edit "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi
