# DO NOT TAG THIS DEV REPO TO RELEASE.
# Releases are cut on the PUBLIC deploy mirror (wonkwonlee/gotsaeng-os), not here.
# The npm OIDC Trusted Publisher is bound to the public repo's release.yml, so tagging
# this dev repo runs the workflow but the publish step fails (404 / no permission).
# See CLAUDE.md § "Release Process".
#
# PRE-REQUISITE (manual, npm web UI): npm Trusted Publisher (OIDC) must be configured for
# @gotsaeng/core, @gotsaeng/cli, AND @gotsaeng/mcp, bound to this repository's release.yml
# workflow, or the OIDC publish step for that package silently fails. Done for all three as
# of the Release 0.12.0 tag, which published @gotsaeng/mcp@0.12.0 through this workflow —
# @gotsaeng/mcp needed a one-time manual bootstrap publish before its Trusted Publisher
# could be configured (an unpublished package has no npm Settings page); see the historical
# "bootstrap publish" section in docs/release.md. Re-run this pre-requisite only if adding a
# new publishable package in the future.
# See: https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions

name: Release

on:
  push:
    tags:
      # Bare version tags only — NO "v" prefix (e.g. "0.10.1", not "v0.10.1").
      # This matches Obsidian's tag-equals-manifest-version rule.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the tag-on-main check below needs full history to
      # compute ancestry, not just the tagged commit itself.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag only proves someone with tag-push rights created it — not that
      # it points at reviewed code. Branch protection on `main` doesn't cover
      # tags unless a separate ruleset does, so without this check, anyone
      # who can push a tag (even without merge rights on `main`) could point
      # a version tag at unreviewed history and trigger a provenance-backed
      # npm publish + GitHub release from it, bypassing PR review entirely.
      - name: Verify tag targets a commit on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main. Refusing to publish from unreviewed history."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 8.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint

      # Built once here and reused by the github-release job below, so that
      # write-permission job never has to run pnpm install/build itself —
      # see the comment on github-release's permissions for why.
      #
      # retention-days is generous (not the 1-day default) because the
      # `publish` job below can sit waiting on a required-reviewer approval
      # (see docs/release.md's "Optional: require manual approval before
      # publish") for as long as the approver takes. A 1-day retention could
      # expire this artifact mid-wait: publish would then still succeed
      # (npm's OIDC exchange doesn't need it), but github-release's download
      # step would fail afterward with the npm packages already published
      # and no clean way to rerun just the GitHub Release step, since the
      # version is now immutable on npm.
      - name: Upload Obsidian plugin build
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin-dist
          path: |
            apps/obsidian-plugin/dist/main.js
            apps/obsidian-plugin/dist/manifest.json
            apps/obsidian-plugin/dist/styles.css
          retention-days: 14

  publish:
    name: Publish to npm (OIDC)
    needs: quality
    runs-on: ubuntu-latest
    # Matches the Environment set on each package's npm Trusted Publisher (see
    # docs/release.md). A no-op until a "required reviewers" protection rule
    # is configured on this Environment in repo settings — see docs/release.md
    # "Optional: require manual approval before publish" for why that's worth
    # doing: it pauses this job for human approval before the OIDC exchange
    # and before any package script runs, even for a tag that already passed
    # the always-on tag-targets-main check in `quality`.
    environment: release
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing + provenance

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 8.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Upgrade npm before publishing. Node 20's bundled npm is 10.x, which does NOT
      # support OIDC trusted publishing at all (that shipped in npm 11.5.1) — pinning to
      # npm@10 (tried on 2026-08-07) silently fell back to an unauthenticated publish
      # and failed with a 404, since no NODE_AUTH_TOKEN is set. npm 11.x requires Node
      # ^20.17.0 || >=22.9.0, which this job's Node 20 satisfies, and supports OIDC.
      # `npm@latest` (currently 12.x) requires Node >=22.22/24.15/26 and broke this step
      # outright before that. Pin to the 11.x line: new enough for OIDC trusted
      # publishing, old enough to run on this job's Node 20.
      - name: Upgrade npm
        run: npm install -g npm@11

      # npm's default publish dist-tag is `latest`. Without this, a prerelease tag like
      # 0.13.0-beta.1 would publish under `latest` and become what unpinned installs
      # (npx @gotsaeng/mcp, npm install @gotsaeng/cli) resolve — silently replacing the
      # last stable version. Mirrors the prerelease detection the github-release job below
      # already uses for GITHUB_REF_NAME.
      - name: Determine npm dist-tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # Publish @gotsaeng/core FIRST — @gotsaeng/cli depends on it.
      # Publishing cli before core would leave a window where cli resolves a stale core.
      # No NODE_AUTH_TOKEN: npm obtains a short-lived token from the GitHub OIDC provider
      # automatically when id-token: write is set and a Trusted Publisher is configured.
      - name: Publish @gotsaeng/core
        run: pnpm --filter @gotsaeng/core publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

      # Publish @gotsaeng/cli SECOND — after core is live on the registry.
      - name: Publish @gotsaeng/cli
        run: pnpm --filter @gotsaeng/cli publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

      # Publish @gotsaeng/mcp THIRD — it also depends on @gotsaeng/core.
      # @gotsaeng/mcp@0.12.0 published successfully through this OIDC step as part of
      # Release 0.12.0. The one-time manual bootstrap publish and Trusted Publisher
      # registration this step originally depended on are both complete — see the
      # historical "bootstrap publish" section in docs/release.md.
      - name: Publish @gotsaeng/mcp
        run: pnpm --filter @gotsaeng/mcp publish --access public --provenance --no-git-checks --tag "$NPM_TAG"

  github-release:
    name: GitHub Release
    needs: publish # only cut a GitHub release once npm publish succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the Obsidian plugin assets
      id-token: write # required by actions/attest-build-provenance
      attestations: write # required by actions/attest-build-provenance

    # No pnpm install/build runs in this job on purpose: it holds a
    # contents:write token, and a compromised dependency's install/build
    # script running here could use the checkout-persisted credential to
    # push commits or tags. The only things this job does are read
    # CHANGELOG.md (no code execution) and call `gh release`, so it uses the
    # plugin build already produced under quality's read-only token instead
    # of building its own.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Obsidian plugin build
        uses: actions/download-artifact@v4
        with:
          name: obsidian-plugin-dist
          path: apps/obsidian-plugin/dist

      # Attest build provenance for the Obsidian plugin assets before they are
      # uploaded, so installers can verify the release artifacts were built by
      # this workflow from this repo's source rather than uploaded by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/obsidian-plugin/dist/main.js
            apps/obsidian-plugin/dist/manifest.json
            apps/obsidian-plugin/dist/styles.css

      # Use this version's CHANGELOG.md section as the release body.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v header="## ${version}" '
            $0 == header { capture = 1; next }
            /^## / { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${version}" > release-notes.md
          fi

      # Create-or-update so a re-run after a flake is safe (npm has already
      # published by this point and cannot be re-published).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;  # tags like 0.10.6-beta.1 are pre-releases
          esac
          assets=(
            apps/obsidian-plugin/dist/main.js
            apps/obsidian-plugin/dist/manifest.json
            apps/obsidian-plugin/dist/styles.css
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating notes and assets."
            gh release edit "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi
